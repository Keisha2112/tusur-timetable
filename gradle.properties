org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
kotlin.code.style=official

# Инкрементальная компиляция Kotlin нестабильна при сборке через junction
# (C:\tusur-work -> путь с кириллицей): компилятор теряет часть символов модуля
# и падает с Unresolved reference на соседние файлы. Полная компиляция надёжнее.
kotlin.incremental=false
